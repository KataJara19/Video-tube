# /etc/nginx/conf.d/videotube.conf
# Nginx recibe el tráfico en el puerto 80 y lo reenvía a FastAPI (127.0.0.1:8000).
server {
    listen 80 default_server;
    server_name _;

    # Videos de hasta 100 MB + miniatura + campos del formulario
    client_max_body_size 110M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;   # la subida pasa directo a FastAPI
        proxy_read_timeout 300s;
    }
}
